# ============================================================
# PART (a): Database Connectivity Configuration
# ============================================================

# ----- MySQL Database Connection -----
# Change the database name, username, and password as per your setup
spring.datasource.url=jdbc:mysql://localhost:3306/exp6_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ----- JPA / Hibernate Settings -----
# "update" = Hibernate will auto-create/update tables based on entity classes
spring.jpa.hibernate.ddl-auto=update

# Show the SQL queries that Hibernate generates (useful for Part c)
spring.jpa.show-sql=true

# Format the SQL nicely in the console
spring.jpa.properties.hibernate.format_sql=true

# Tell Hibernate we are using MySQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
